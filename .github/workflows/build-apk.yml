name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DICE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DICE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using private keystore from secrets"
          else
            echo "Using the public keystore from the repository"
          fi

      - name: Build release APK
        env:
          DICE_KEYSTORE_PASSWORD: ${{ secrets.DICE_KEYSTORE_PASSWORD }}
          DICE_KEY_ALIAS: ${{ secrets.DICE_KEY_ALIAS }}
          DICE_KEY_PASSWORD: ${{ secrets.DICE_KEY_PASSWORD }}
        run: |
          # Empty secrets would override the defaults, so unset them.
          [ -z "$DICE_KEYSTORE_PASSWORD" ] && unset DICE_KEYSTORE_PASSWORD
          [ -z "$DICE_KEY_ALIAS" ] && unset DICE_KEY_ALIAS
          [ -z "$DICE_KEY_PASSWORD" ] && unset DICE_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dobbelstenen-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dobbelstenen-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Dobbelstenen 1.0.${{ github.run_number }}" \
            --notes "Automatische build van ${{ github.sha }}. Download de .apk hieronder en open hem op je Android-telefoon."
